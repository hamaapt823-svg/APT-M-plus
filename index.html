<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus - AKB Media</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #24A1DE;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 10px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 5px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
    }

    /* Feed Container */
    .telegram-feed-wrapper {
      width: 100%;
      height: 82vh;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .telegram-feed-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">APT M Plus</div>
      <span style="font-size: 13px; color: var(--accent-color);">AKB Media</span>
    </header>

    <!-- Telegram Channel Web Feed -->
    <div class="telegram-feed-wrapper">
      <iframe src="https://t.me/s/akb_media" title="AKB Media Telegram Feed"></iframe>
    </div>
  </div>

</body>
</html>
