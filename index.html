<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 15px;
    }

    .container { max-width: 650px; margin: 0 auto; }

    /* هێدەری جێگیر */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); }
    
    .live-tag {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* بەشی جێگیری گەڕان */
    .search-box {
      width: 100%;
      padding: 10px 15px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      margin-bottom: 15px;
      font-size: 14px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-color);
    }

    /* پێکهاتەی جێگیری کارتەکان */
    .feed-grid { display: flex; flex-direction: column; gap: 12px; }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      min-height: 90px;
    }

    .news-card img {
      width: 90px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background-color: #1e222d;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .news-source {
      font-size: 11px;
      color: var(--accent-color);
      font-weight: bold;
    }

    .news-title {
      font-size: 13px;
      line-height: 1.4;
      color: #f1f1f1;
      margin-top: 4px;
    }

    .news-date {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .status-msg { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">APT M Plus</div>
      <div class="live-tag">LIVE</div>
    </header>

    <!-- گەڕان بۆ فلتەرکردنی هەواڵەکان (بۆ نموونە: مووچە) -->
    <input type="text" id="searchInput" class="search-box" placeholder="گەڕان لە هەواڵەکان (بۆ نموونە: مووچە)..." onkeyup="filterNews()">

    <div id="status" class="status-msg">لەبارکردندایە...</div>
    <div id="feedContainer" class="feed-grid"></div>
  </div>

  <script>
    let fetchedArticles = [];

    // بەشی هێنانی داتا (تەنها ئەم بەشە کار دەکات بێ ئەوەی دیزاین بگۆڕێت)
    async function initApp() {
      const statusEl = document.getElementById('status');
      const container = document.getElementById('feedContainer');

      try {
        // بەکارهێنانی سەرچاوەی کارا
        const res = await fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://www.rudaw.net/sorani/rss'));
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const items = xmlDoc.querySelectorAll("item");

        statusEl.style.display = 'none';

        items.forEach((item, index) => {
          if (index >= 20) return;

          const title = item.querySelector("title")?.textContent || '';
          const link = item.querySelector("link")?.textContent || '#';
          const pubDateRaw = item.querySelector("pubDate")?.textContent || '';
          const enclosure = item.querySelector("enclosure");
          const imgUrl = enclosure ? enclosure.getAttribute("url") : '';

          fetchedArticles.push({
            title,
            link,
            img: imgUrl,
            date: pubDateRaw ? new Date(pubDateRaw) : new Date()
          });
        });

        renderNews(fetchedArticles);
      } catch (err) {
        statusEl.innerText = 'نەتوانرا هەواڵەکان باربکرێن. تکایە لاپەڕەکە ڕێفرێش بکەرەوە.';
      }
    }

    function renderNews(articles) {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      articles.forEach(art => {
        const card = document.createElement('a');
        card.className = 'news-card';
        card.href = art.link;
        card.target = '_blank';

        const pubDate = art.date.toLocaleString('ckb-IQ', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
        const imgHtml = art.img ? `<img src="${art.img}" alt="news">` : '<div style="width:90px;height:70px;background:#1e222d;border-radius:8px;flex-shrink:0;"></div>';

        card.innerHTML = `
          ${imgHtml}
          <div class="news-content">
            <div>
              <span class="news-source">هەواڵ</span>
              <h2 class="news-title">${art.title}</h2>
            </div>
            <span class="news-date">${pubDate}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // فلتەرکردنی هەواڵەکان بەپێی وشە
    function filterNews() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = fetchedArticles.filter(art => art.title.toLowerCase().includes(query));
      renderNews(filtered);
    }

    initApp();
  </script>
</body>
</html>
