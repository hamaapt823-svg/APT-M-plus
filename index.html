<!DOCTYPE html>
<html lang="kmr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APT M+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-white font-sans dir-rtl">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [search, setSearch] = useState('');

        return (
          <div className="min-h-screen bg-slate-950 text-white font-sans dir-rtl">
            {/* Header */}
            <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
              <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="relative flex items-center justify-center w-10 h-10 rounded-full bg-slate-950 border border-amber-500/30">
                    <span className="text-amber-400 font-bold text-xl">☀</span>
                  </div>
                  <div>
                    <h1 className="text-xl font-bold tracking-wider text-amber-400">APT M+</h1>
                    <p className="text-xs text-slate-400">دەزگای میدیایی ئەی پـی تی</p>
                  </div>
                </div>

                <div className="flex gap-1">
                  <span className="w-3 h-3 rounded-full bg-[#ED2024]"></span>
                  <span className="w-3 h-3 rounded-full bg-[#FEBD11]"></span>
                  <span className="w-3 h-3 rounded-full bg-[#278E43]"></span>
                </div>
              </div>
            </header>

            {/* Main Content */}
            <main className="max-w-4xl mx-auto px-4 py-12 text-center">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 mb-6 text-sm">
                <span>✦</span>
                <span>سەکۆی هەواڵی دەزگای APT M+</span>
              </div>

              <h2 className="text-4xl md:text-5xl font-black text-slate-100 mb-6 leading-tight">
                سەرچاوەی زانیاری و هەواڵە خێراکان
              </h2>

              {/* Search Bar */}
              <div className="relative max-w-xl mx-auto mb-12">
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="گەڕان بۆ هەواڵەکان..."
                  className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-4 pr-12 pl-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 shadow-lg"
                />
              </div>

              {/* Cards */}
              <div className="grid md:grid-cols-2 gap-6 text-right">
                <div className="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 hover:border-slate-700 transition">
                  <h3 className="text-lg font-bold mb-2 text-amber-400">📰 هەواڵەکانی کوردستان</h3>
                  <p className="text-slate-400 text-sm">پۆشینی تەواوی هەواڵە ناوخۆییەکانی کوردستان و دەوروبەری.</p>
                </div>

                <div className="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 hover:border-slate-700 transition">
                  <h3 className="text-lg font-bold mb-2 text-emerald-400">🌐 هەواڵە نێودەوڵەتییەکان</h3>
                  <p className="text-slate-400 text-sm">کۆکردنەوەی ڕووداوە گرنگەکانی جیهان بە زانیاری ورد.</p>
                </div>
              </div>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
