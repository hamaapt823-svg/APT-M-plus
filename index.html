<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەپی هەواڵەکان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .header { text-align: center; background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .news-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .news-title { font-size: 1.4em; color: #e74c3c; font-weight: bold; margin-bottom: 10px; }
        .news-content { font-size: 1.1em; color: #34495e; line-height: 1.6; }
        .news-time { font-size: 0.8em; color: #7f8c8d; margin-bottom: 15px; }
        .loading { text-align: center; color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="header">
        <h1>سەرەکیترین هەواڵەکان (ڕاستەوخۆ)</h1>
    </div>
    <div id="news-feed"><p class="loading">چاوەڕێی هەواڵەکان بکە...</p></div>

    <script>
        // بەستەر و کلیلی گشتی پڕۆژەکەت
        const supabaseUrl = 'https://pzucdmjnkvptmedrwtnm.supabase.co';
        const supabaseKey = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6dWNkbWpua3ZwdG1lZHJ3dG5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODQ0MjIsImV4cCI6MjEwNTQ2MDQyMn0.fSgHzvBlsZjlE969cJzjNtcc2Zimhrp0YI_ApZVOV_g';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchNews() {
            const { data, error } = await supabase.from('news').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error(error);
                return;
            }
            const feed = document.getElementById('news-feed');
            feed.innerHTML = '';
            
            if (data.length === 0) {
                feed.innerHTML = '<p class="loading">هیچ هەواڵێک بوونی نییە.</p>';
                return;
            }
            
            data.forEach(news => {
                feed.innerHTML += `
                    <div class="news-card">
                        <div class="news-title">${news.title}</div>
                        <div class="news-content">${news.content.replace(/\n/g, '<br>')}</div>
                    </div>
                `;
            });
        }

        // هێنانی هەواڵەکان لە کاتی کردنەوەی ئەپەکە
        fetchNews();

        // چاودێریکردنی داتابەیز بۆ هەواڵی نوێ بێ ڕیفرێش
        supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'news' }, payload => {
                fetchNews();
            })
            .subscribe();
    </script>
</body>
</html>
