<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 12px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .logo { font-size: 20px; font-weight: bold; color: var(--accent-color); }
    
    .live-tag {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 10px 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent-color); }

    .search-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .news-card img {
      width: 90px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background-color: #1e222d;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .news-title {
      font-size: 13px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .news-desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status-msg { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 13px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">APT M Plus</div>
      <div class="live-tag">LIVE</div>
    </header>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="گەڕان بەدوای هەواڵدا...">
      <button class="search-btn" onclick="executeSearch()">سێرچ</button>
    </div>

    <main class="feed-container" id="feedContainer">
      <div class="status-msg">بارکردنی تازەترین هەواڵەکان...</div>
    </main>
  </div>

  <script>
    let articlesCache = [];

    async function fetchNews() {
      const container = document.getElementById('feedContainer');
      
      // بەکارهێنانی ڕاستەوخۆی API بۆ کەمتەرخەمبوونی کێشەی CORS و Serverless
      const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.awene.com%2Frss';

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok' && data.items.length > 0) {
          articlesCache = data.items.map(item => {
            const temp = document.createElement('div');
            temp.innerHTML = item.description || '';
            const cleanText = temp.textContent || temp.innerText || '';

            return {
              title: item.title,
              link: item.link,
              description: cleanText.trim().slice(0, 140) + '...',
              img: item.thumbnail || item.enclosure?.link || ''
            };
          });

          renderArticles(articlesCache);
        } else {
          container.innerHTML = '<div class="status-msg">هیچ هەواڵێک بەردەست نییە.</div>';
        }
      } catch (err) {
        container.innerHTML = '<div class="status-msg">کێشە لە گرێدان ڕوویدا. تکایە سەرلەنوێ هەوڵبدەرەوە.</div>';
      }
    }

    function renderArticles(articles) {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      if (articles.length === 0) {
        container.innerHTML = '<div class="status-msg">هیچ ئەنجامێک نەدۆزرایەوە.</div>';
        return;
      }

      articles.forEach(art => {
        const card = document.createElement('a');
        card.className = 'news-card';
        card.href = art.link;
        card.target = '_blank';

        const imgTag = art.img 
          ? `<img src="${art.img}" alt="news" onerror="this.style.display='none'">` 
          : '<div style="width:90px;height:70px;background:#1e222d;border-radius:6px;flex-shrink:0;"></div>';

        card.innerHTML = `
          ${imgTag}
          <div class="news-content">
            <div>
              <h2 class="news-title">${art.title}</h2>
              <p class="news-desc">${art.description}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        renderArticles(articlesCache);
        return;
      }

      const filtered = articlesCache.filter(item => 
        item.title.toLowerCase().includes(query) || 
        item.description.toLowerCase().includes(query)
      );
      renderArticles(filtered);
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeSearch();
    });

    fetchNews();
  </script>
</body>
</html>
