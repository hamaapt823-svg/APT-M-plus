<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus - هەواڵە زیندوەکان</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 15px;
    }

    .container { max-width: 650px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); }
    
    .live-tag {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .feed-grid { display: flex; flex-direction: column; gap: 15px; }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .news-card img {
      width: 100px;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .news-source {
      font-size: 11px;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 4px;
    }

    .news-title {
      font-size: 13px;
      line-height: 1.5;
      color: #f1f1f1;
    }

    .news-date {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .loading, .error { text-align: center; padding: 40px; color: var(--text-secondary); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">APT M Plus</div>
      <div class="live-tag">LIVE - چرکە بە چرکە</div>
    </header>

    <div id="loading" class="loading">داگرتنی نوێترین هەواڵەکانی کوردستان و جیهان...</div>
    <div id="error" class="error" style="display: none; color: var(--accent-color);"></div>
    <div id="feedContainer" class="feed-grid"></div>
  </div>

  <script>
    const RSS_URL = 'https://www.rudaw.net/sorani/rss';
    const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

    async function loadNews() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const container = document.getElementById('feedContainer');

      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        loadingEl.style.display = 'none';

        if (data.status === 'ok' && data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const card = document.createElement('a');
            card.className = 'news-card';
            card.href = item.link;
            card.target = '_blank';

            const pubDate = item.pubDate ? new Date(item.pubDate).toLocaleString('ckb-IQ', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' }) : '';
            const imgHtml = item.thumbnail ? `<img src="${item.thumbnail}" alt="News">` : '<div style="width:100px;height:75px;background:#1e222d;border-radius:8px;flex-shrink:0;"></div>';

            card.innerHTML = `
              ${imgHtml}
              <div class="news-content">
                <div>
                  <span class="news-source">ڕووداو</span>
                  <h2 class="news-title">${item.title}</h2>
                </div>
                <span class="news-date">${pubDate}</span>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          throw new Error('هیچ هەواڵێک بەردەست نییە');
        }
      } catch (err) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.innerText = 'کێشەیەک لە بارکردنی هەواڵەکان ڕوویدا. تکایە هێڵی ئینتەرنێتەکەت بپشکنە.';
      }
    }

    loadNews();
  </script>
</body>
</html>
