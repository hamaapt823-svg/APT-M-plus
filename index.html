<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus - AKB Media</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #24A1DE; /* ڕەنگی تیلیگرام */
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 15px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .badge {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Feed Container */
    .feed-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 450px;
    }

    .telegram-post-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* Button to Open Channel */
    .btn-telegram {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--accent-color);
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .btn-telegram:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">APT M Plus</div>
      <div class="badge">AKB Media</div>
    </header>

    <!-- Telegram Feed Section -->
    <div class="feed-container">
      <div class="telegram-post-wrapper">
        <!-- بەکارهێنانی Widgetی تیلیگرام بۆ پۆستەکانی akb_media -->
        <script async src="https://telegram.org/js/telegram-widget.js?22" 
                data-telegram-discussion="akb_media" 
                data-comments-limit="5"
                data-width="100%" 
                data-userpic="true" 
                data-color="24A1DE" 
                data-dark="1">
        </script>
      </div>
    </div>

    <!-- Direct Channel Link Button -->
    <a href="https://t.me/akb_media" target="_blank" class="btn-telegram">
      سەردانی کەناڵی فەرمی AKB Media بکە لە تیلیگرام
    </a>
  </div>

</body>
</html>
