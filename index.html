<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APT Media</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #000; color: #fff; text-align: center; padding: 20px; }
        #news-container { max-width: 600px; margin: 0 auto; text-align: right; }
        .news-item { background: #111; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; }
        .news-item h3 { margin-top: 0; color: #e50914; }
        .news-item p { color: #ccc; }
        .news-item small { color: #666; font-size: 12px; }
        .loading { color: #ff0000; font-weight: bold; }
        .error { color: #ff4444; }
    </style>
</head>
<body>
    <h1>APT Media</h1>
    <div id="news-container">
        <p class="loading" id="loading-text">لە بارکردنی نوێترین هەواڵەکانی APT Media...</p>
    </div>

    <script>
        async function fetchNews() {
            const container = document.getElementById('news-container');
            
            try {
                // هێنانی داتاکان لە APIـیەکەی خۆتەوە
                const response = await fetch('/api/news');
                if (!response.ok) throw new Error('کێشە لە پەیوەندی هەیە');
                
                const result = await response.json();
                const newsData = result.data;

                // پیشاندانی هەواڵەکان ئەگەر بوونیان هەبوو
                if (newsData && newsData.length > 0) {
                    container.innerHTML = ''; 
                    newsData.forEach(news => {
                        const newsDiv = document.createElement('div');
                        newsDiv.className = 'news-item';
                        newsDiv.innerHTML = `
                            <h3>${news.title}</h3>
                            <p>${news.content}</p>
                            <small>${news.date}</small>
                        `;
                        container.appendChild(newsDiv);
                    });
                } else {
                    container.innerHTML = '<p class="error">هیچ هەواڵێک بەردەست نییە لەم مەودایەدا.</p>';
                }
            } catch (error) {
                console.error('Error fetching news:', error);
                container.innerHTML = '<p class="error">کێشەیەک هەیە لە هێنانی هەواڵەکان، تکایە ئینتەرنێتەکەت بپشکنە.</p>';
            }
        }

        window.onload = fetchNews;
    </script>
</body>
</html>
