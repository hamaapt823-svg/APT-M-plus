<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus - AKB Media</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #24A1DE;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 15px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .feed-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .post-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      border: 1px solid var(--border-color);
      line-height: 1.6;
      font-size: 14px;
    }

    .post-date {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 10px;
      display: block;
    }

    .loading, .error {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .btn-telegram {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--accent-color);
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">APT M Plus</div>
      <span style="font-size: 13px; color: var(--accent-color);">AKB Media</span>
    </header>

    <div id="loading" class="loading">داگرتنی پۆستەکانی AKB Media...</div>
    <div id="error" class="error" style="display: none; color: #ff4d4d;"></div>
    <div id="feedContainer" class="feed-grid"></div>

    <a href="https://t.me/akb_media" target="_blank" class="btn-telegram">
      کردنەوەی ڕاستەوخۆ لە ئەپی تیلیگرام
    </a>
  </div>

  <script>
    // بەکارهێنانی RSS Feed بۆ پۆستەکانی کەناڵی AKB Media لە تیلیگرام
    const TELEGRAM_RSS = 'https://rsshub.app/telegram/channel/akb_media';
    const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(TELEGRAM_RSS)}`;

    async function fetchTelegramPosts() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        document.getElementById('loading').style.display = 'none';

        if (data.status === 'ok' && data.items.length > 0) {
          const container = document.getElementById('feedContainer');
          
          data.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'post-card';

            const pubDate = item.pubDate ? new Date(item.pubDate).toLocaleString('ckb-IQ') : '';

            card.innerHTML = `
              <div>${item.content || item.title}</div>
              <span class="post-date">${pubDate}</span>
            `;
            container.appendChild(card);
          });
        } else {
          throw new Error('پۆستەکان نەدۆزرانەوە');
        }
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        const errDiv = document.getElementById('error');
        errDiv.style.display = 'block';
        errDiv.innerText = 'نەتوانرا پۆستەکان باربکرێن. تکایە هێڵی ئینتەرنێت بپشکنە.';
      }
    }

    fetchTelegramPosts();
  </script>
</body>
</html>
