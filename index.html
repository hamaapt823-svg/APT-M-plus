<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 15px;
    }

    .container { max-width: 650px; margin: 0 auto; }

    /* هێدەری جێگیر */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); }
    
    .live-tag {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* بەشی گەڕانی چالاک (Search Bar + Button) */
    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent-color); }

    .search-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    /* تابەکانی پۆلێنکردنی هەواڵ (Categories) */
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
      scrollbar-width: none; /* بۆ شاراوەیی scrollbar لە فایرفۆکس */
    }

    .categories::-webkit-scrollbar { display: none; } /* بۆ شوێنەکانی تر */

    .cat-btn {
      background-color: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* لۆدینگ و پەیامەکان */
    .status-msg { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 13px; }

    /* کارتەکانی هەواڵ */
    .feed-grid { display: flex; flex-direction: column; gap: 12px; }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .news-card img {
      width: 90px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background-color: #1e222d;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .news-source {
      font-size: 11px;
      color: var(--accent-color);
      font-weight: bold;
    }

    .news-title {
      font-size: 13px;
      line-height: 1.4;
      color: #f1f1f1;
      margin-top: 4px;
    }

    .news-date {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- هێدەری جێگیر -->
    <header>
      <div class="logo">APT M Plus</div>
      <div class="live-tag">LIVE</div>
    </header>

    <!-- گەڕان بە دوگمەی سێرچ -->
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="گەڕان بەدوای هەواڵدا...">
      <button class="search-btn" onclick="executeSearch()">سێرچ</button>
    </div>

    <!-- پۆلێنکردنی هەواڵەکان -->
    <div class="categories">
      <button class="cat-btn active" onclick="switchCategory('all', this)">هەمووی</button>
      <button class="cat-btn" onclick="switchCategory('local', this)">هەواڵی ناوخۆیی</button>
      <button class="cat-btn" onclick="switchCategory('world', this)">هەواڵی جیهانی</button>
      <button class="cat-btn" onclick="switchCategory('sports', this)">هەواڵی وەرزشی</button>
      <button class="cat-btn" onclick="switchCategory('economy', this)">هەواڵی ئابووری</button>
    </div>

    <!-- شوێنی هەواڵەکان -->
    <div id="status" class="status-msg">بارکردنی هەواڵەکان...</div>
    <div id="feedContainer" class="feed-grid"></div>
  </div>

  <script>
    let allArticles = [];

    // هێنانی هەواڵەکان لە RSS بە پرۆکسی
    async function loadNews() {
      const statusEl = document.getElementById('status');
      try {
        const res = await fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://www.rudaw.net/sorani/rss'));
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const items = xmlDoc.querySelectorAll("item");

        statusEl.style.display = 'none';

        allArticles = [];
        items.forEach((item, index) => {
          if (index >= 25) return;

          const title = item.querySelector("title")?.textContent || '';
          const link = item.querySelector("link")?.textContent || '#';
          const pubDateRaw = item.querySelector("pubDate")?.textContent || '';
          const enclosure = item.querySelector("enclosure");
          const imgUrl = enclosure ? enclosure.getAttribute("url") : '';

          allArticles.push({
            title,
            link,
            img: imgUrl,
            date: pubDateRaw ? new Date(pubDateRaw) : new Date()
          });
        });

        renderNews(allArticles);
      } catch (err) {
        statusEl.innerText = 'کێشەیەک لە بارکردنی هەواڵەکان ڕوویدا.';
      }
    }

    // پێشاندانی هەواڵەکان
    function renderNews(articles) {
      const container = document.getElementById('feedContainer');
      const statusEl = document.getElementById('status');
      container.innerHTML = '';

      if (articles.length === 0) {
        statusEl.style.display = 'block';
        statusEl.innerText = 'هیچ هەواڵێک نەدۆزرایەوە.';
        return;
      }

      statusEl.style.display = 'none';

      articles.forEach(art => {
        const card = document.createElement('a');
        card.className = 'news-card';
        card.href = art.link;
        card.target = '_blank';

        const pubDate = art.date.toLocaleString('ckb-IQ', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
        const imgHtml = art.img ? `<img src="${art.img}" alt="news">` : '<div style="width:90px;height:70px;background:#1e222d;border-radius:8px;flex-shrink:0;"></div>';

        card.innerHTML = `
          ${imgHtml}
          <div class="news-content">
            <div>
              <span class="news-source">هەواڵ</span>
              <h2 class="news-title">${art.title}</h2>
            </div>
            <span class="news-date">${pubDate}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // فرمانی سێرچ بە فشارداگرتنی دوگمەکە یان Enter
    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        renderNews(allArticles);
        return;
      }
      const filtered = allArticles.filter(art => art.title.toLowerCase().includes(query));
      renderNews(filtered);
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        executeSearch();
      }
    });

    // گۆڕینی بەشەکان (Categories)
    function switchCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // لە کاتی بەستنەوەی سەرچاوەی جیاوازدا لێرەوە فیلتەر یان Fetch دەکرێت
      if (cat === 'all') {
        renderNews(allArticles);
      } else {
        // فلتەرکردنی سادە بۆ تاپیکەکان (دەتوانیت دواتر RSSی تایبەت بە هەر بەشێک دابنێیت)
        renderNews(allArticles);
      }
    }

    loadNews();
  </script>
</body>
</html>
