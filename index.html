<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 12px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    /* هێدەر */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); }
    
    .live-tag {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* گەڕان */
    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 10px 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent-color); }

    .search-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    /* داڕشتن: بەشەکان لای ڕاست + هەواڵەکان لای چەپ */
    .main-layout {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    /* بەشەکان لە لای ڕاست لە خوار یەک */
    .sidebar-categories {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 130px;
      flex-shrink: 0;
    }

    .cat-btn {
      background-color: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 12px;
      text-align: right;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* لیست و کارتەکان */
    .feed-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 10px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }

    .news-card img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background-color: #1e222d;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .news-source {
      font-size: 10px;
      color: var(--accent-color);
      font-weight: bold;
    }

    .news-title {
      font-size: 12px;
      line-height: 1.4;
      color: #f1f1f1;
      margin-top: 2px;
    }

    .news-date {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .status-msg { text-align: center; padding: 25px; color: var(--text-secondary); font-size: 13px; width: 100%; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">APT M Plus</div>
      <div class="live-tag">LIVE</div>
    </header>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="گەڕان بەدوای هەواڵدا...">
      <button class="search-btn" onclick="executeSearch()">سێرچ</button>
    </div>

    <div class="main-layout">
      <!-- بەشەکان لە خوار یەک لە لای ڕاست -->
      <aside class="sidebar-categories">
        <button class="cat-btn active" onclick="switchCategory('all', this)">هەمووی</button>
        <button class="cat-btn" onclick="switchCategory('local', this)">هەواڵی ناوخۆیی</button>
        <button class="cat-btn" onclick="switchCategory('world', this)">هەواڵی جیهانی</button>
        <button class="cat-btn" onclick="switchCategory('sports', this)">هەواڵی وەرزشی</button>
        <button class="cat-btn" onclick="switchCategory('economy', this)">هەواڵی ئابووری</button>
      </aside>

      <!-- شوێنی هەواڵەکان -->
      <main class="feed-container" id="feedContainer">
        <div id="status" class="status-msg">بارکردنی هەواڵەکان...</div>
      </main>
    </div>
  </div>

  <script>
    let allNews = [];
    let activeCategory = 'all';

    // ڕاستەوخۆ هێنانی API
    const RSS_FEEDS = [
      { name: 'کوردستان ٢٤', url: 'https://www.kurdistan24.net/ckb/rss', cat: 'local' },
      { name: 'وەرزش', url: 'https://www.kurdistan24.net/ckb/rss/sport', cat: 'sports' },
      { name: 'جیهان', url: 'https://www.kurdistan24.net/ckb/rss/world', cat: 'world' },
      { name: 'ئابووری', url: 'https://www.kurdistan24.net/ckb/rss/economy', cat: 'economy' }
    ];

    async function fetchNews() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '<div class="status-msg">بارکردنی هەواڵەکان...</div>';
      allNews = [];

      const promises = RSS_FEEDS.map(async (feed) => {
        try {
          const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
          const response = await fetch(apiUrl);
          const data = await response.json();

          if (data.status === 'ok' && data.items) {
            data.items.forEach(item => {
              allNews.push({
                source: feed.name,
                category: feed.cat,
                title: item.title,
                link: item.link,
                img: item.thumbnail || item.enclosure?.link || '',
                date: new Date(item.pubDate)
              });
            });
          }
        } catch (e) {
          console.error('Error fetching feed:', e);
        }
      });

      await Promise.all(promises);

      // ڕێکخستنی هەواڵەکان بەپێی تازەترین کات
      allNews.sort((a, b) => b.date - a.date);

      if (allNews.length === 0) {
        container.innerHTML = '<div class="status-msg">هیچ هەواڵێک نەدۆزرایەوە. تکایە دوابارە پەڕەکە هێواش بکەرەوە.</div>';
      } else {
        renderNews(allNews);
      }
    }

    function renderNews(articles) {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      if (articles.length === 0) {
        container.innerHTML = '<div class="status-msg">هیچ هەواڵێک لەم بەشەدا نییە.</div>';
        return;
      }

      articles.forEach(art => {
        const card = document.createElement('a');
        card.className = 'news-card';
        card.href = art.link;
        card.target = '_blank';

        const pubDate = art.date && !isNaN(art.date) 
          ? art.date.toLocaleTimeString('ckb-IQ', { hour: '2-digit', minute: '2-digit' }) 
          : '';

        const imgHtml = art.img 
          ? `<img src="${art.img}" alt="news" onerror="this.style.display='none'">` 
          : '<div style="width:80px;height:60px;background:#1e222d;border-radius:6px;flex-shrink:0;"></div>';

        card.innerHTML = `
          ${imgHtml}
          <div class="news-content">
            <div>
              <span class="news-source">${art.source}</span>
              <h2 class="news-title">${art.title}</h2>
            </div>
            <span class="news-date">${pubDate}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = cat;

      if (cat === 'all') {
        renderNews(allNews);
      } else {
        const filtered = allNews.filter(item => item.category === cat);
        renderNews(filtered);
      }
    }

    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      let list = activeCategory === 'all' ? allNews : allNews.filter(i => i.category === activeCategory);

      if (!query) {
        renderNews(list);
        return;
      }

      const filtered = list.filter(art => art.title.toLowerCase().includes(query));
      renderNews(filtered);
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') executeSearch();
    });

    fetchNews();
  </script>
</body>
</html>
