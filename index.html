<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APT Media</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        
        header { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); 
            padding: 15px 0 10px; text-align: center; 
        }
        .logo { color: #ff3b30; font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .nav-tabs { display: flex; justify-content: center; gap: 15px; list-style: none; overflow-x: auto; padding: 0 10px; }
        .nav-tabs li { font-size: 15px; color: #aaa; cursor: pointer; padding-bottom: 5px; white-space: nowrap; }
        .nav-tabs li.active { color: #fff; font-weight: bold; border-bottom: 3px solid #ff3b30; }

        .app-container { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        
        .news-card { 
            height: 100vh; width: 100vw; scroll-snap-align: start; 
            position: relative; background-color: #111; display: flex; align-items: center; justify-content: center; 
        }
        .news-bg { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.65); }
        .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 15%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.6) 100%); }
        
        .news-details { position: absolute; bottom: 40px; right: 80px; left: 20px; z-index: 10; }
        .badge { background-color: #ff3b30; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .news-time { font-size: 12px; color: #ccc; margin-right: 8px; }
        .publisher { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: #ff3b30; }
        .news-title { font-size: 18px; line-height: 1.5; color: #fff; font-weight: 600; }
        
        .action-bar { position: absolute; bottom: 50px; right: 15px; z-index: 10; display: flex; flex-direction: column; gap: 22px; align-items: center; }
        .action-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 26px; }
        .action-btn span { font-size: 12px; color: #ddd; }
        .action-btn.liked i { color: #ff3b30; }

        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff3b30; font-size: 16px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">APT Media</div>
        <ul class="nav-tabs">
            <li class="active" onclick="filterCategory('all', this)">گشتی</li>
            <li onclick="filterCategory('local', this)">ناوخۆیی</li>
            <li onclick="filterCategory('sports', this)">وەرزشی</li>
            <li onclick="filterCategory('economy', this)">ئابووری</li>
        </ul>
    </header>

    <div class="app-container" id="newsFeed">
        <div class="loader" id="loader">لە بارکردنی هەواڵەکاندا...</div>
    </div>

    <script>
        let currentCategory = 'all';

        async function fetchNews() {
            try {
                const response = await fetch(`/api/news?cat=${currentCategory}`);
                const newsList = await response.json();
                renderUI(newsList);
            } catch (error) {
                console.error("Fetch error:", error);
            }
        }

        function renderUI(newsList) {
            const container = document.getElementById('newsFeed');
            container.innerHTML = '';

            newsList.forEach(news => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <img class="news-bg" src="${news.img}" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800'">
                    <div class="overlay"></div>
                    <div class="news-details">
                        <div>
                            <span class="badge">${currentCategory.toUpperCase()}</span>
                            <span class="news-time">${news.date}</span>
                        </div>
                        <div class="publisher">${news.source}</div>
                        <div class="news-title">${news.title}</div>
                    </div>
                    <div class="action-bar">
                        <button class="action-btn" onclick="toggleLike(this)">
                            <i class="bi bi-heart-fill"></i>
                            <span>152</span>
                        </button>
                        <button class="action-btn" onclick="window.open('${news.link}', '_blank')">
                            <i class="bi bi-box-arrow-up-right"></i>
                            <span>خوێندنەوە</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(cat, element) {
            document.querySelectorAll('.nav-tabs li').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentCategory = cat;
            document.getElementById('newsFeed').innerHTML = '<div class="loader">لە بارکردنی هەواڵەکاندا...</div>';
            fetchNews();
        }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
        }

        fetchNews();
        setInterval(fetchNews, 30000);
    </script>
</body>
</html>
