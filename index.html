<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کوردستان ٢٤ - هەواڵەکان</title>
  <style>
    body {
      background-color: #090a0f;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      border-bottom: 2px solid #e2001a;
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      color: #e2001a;
      margin: 0;
      font-size: 24px;
    }
    .badge {
      font-size: 12px;
      background: #222;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .news-grid {
      display: grid;
      gap: 20px;
    }
    .news-card {
      background-color: #161922;
      border-radius: 8px;
      padding: 15px;
      text-decoration: none;
      color: #fff;
      border: 1px solid #2a2e3d;
      display: block;
    }
    .news-card img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .news-card h2 {
      font-size: 18px;
      margin: 0 0 10px 0;
      line-height: 1.4;
      color: #f1f1f1;
    }
    .news-card span {
      font-size: 12px;
      color: #888;
    }
    .loading, .error {
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>کوردستان ٢٤ - دوایین هەواڵەکان</h1>
      <span class="badge">ڕاستەوخۆ</span>
    </header>

    <div id="loading" class="loading">داگرتنی هەواڵەکانی کوردستان ٢٤...</div>
    <div id="error" class="error" style="display: none; color: #ff4d4d;"></div>
    <div id="news-container" class="news-grid"></div>
  </div>

  <script>
    const RSS_URL = 'https://www.kurdistan24.net/ku/rss';
    const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

    fetch(API_URL)
      .then(res => {
        if (!res.ok) throw new Error('کێشە لە پەیوەندی بە سەرڤەر ڕوویدا');
        return res.json();
      })
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        if (data.status === 'ok') {
          const container = document.getElementById('news-container');
          data.items.forEach(item => {
            const card = document.createElement('a');
            card.className = 'news-card';
            card.href = item.link;
            card.target = '_blank';

            const imgHtml = item.thumbnail ? `<img src="${item.thumbnail}" alt="${item.title}">` : '';
            const pubDate = new Date(item.pubDate).toLocaleDateString('ckb-IQ', {
              year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            card.innerHTML = `
              ${imgHtml}
              <h2>${item.title}</h2>
              <span>${pubDate}</span>
            `;
            container.appendChild(card);
          });
        } else {
          throw new Error('نەتوانرا هەواڵەکان باربکرێن');
        }
      })
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        const errDiv = document.getElementById('error');
        errDiv.style.display = 'block';
        errDiv.innerText = 'کێشەیەک ڕوویدا: ' + err.message;
      });
  </script>
</body>
</html>
