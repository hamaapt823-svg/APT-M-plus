<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APT Media</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
        body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); padding: 15px 0 10px; text-align: center; }
        .logo { color: #ff3b30; font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .nav-tabs { display: flex; justify-content: center; gap: 15px; list-style: none; overflow-x: auto; }
        .nav-tabs li { font-size: 15px; color: #aaa; cursor: pointer; padding-bottom: 5px; }
        .nav-tabs li.active { color: #fff; font-weight: bold; border-bottom: 3px solid #ff3b30; }
        .app-container { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .news-card { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; background-color: #111; display: flex; align-items: center; justify-content: center; }
        .news-bg { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); }
        .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.6) 100%); }
        .news-details { position: absolute; bottom: 40px; right: 80px; left: 20px; z-index: 10; }
        .badge { background-color: #ff3b30; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .news-time { font-size: 12px; color: #ccc; margin-right: 8px; }
        .publisher { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: #ff3b30; }
        .news-title { font-size: 18px; line-height: 1.5; color: #fff; font-weight: 600; }
        .action-bar { position: absolute; bottom: 50px; right: 15px; z-index: 10; display: flex; flex-direction: column; gap: 22px; align-items: center; }
        .action-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 26px; }
        .action-btn span { font-size: 12px; color: #ddd; }
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff3b30; font-size: 18px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">APT Media</div>
        <ul class="nav-tabs">
            <li class="active" onclick="filterNews('گشتی', this)">گشتی</li>
            <li onclick="filterNews('ناوخۆیی', this)">ناوخۆیی</li>
            <li onclick="filterNews('وەرزشی', this)">وەرزشی</li>
            <li onclick="filterNews('ئابووری', this)">ئابووری</li>
        </ul>
    </header>

    <div class="app-container" id="newsFeed">
        <div class="loader" id="loader"><i class="bi bi-arrow-repeat spin"></i> لە بارکردنی هەواڵە نوێیەکاندا...</div>
    </div>

    <script>
        // بەکارهێنانی CorsProxy بۆ ڕێگریکردن لە بلۆکبوون لەسەر Vercel
        const proxy = "https://api.allorigins.win/raw?url=";
        
        const newsSources = [
            { category: 'گشتی', url: 'https://www.rudaw.net/sorani/rss' },
            { category: 'ناوخۆیی', url: 'https://www.rudaw.net/sorani/kurdistan/rss' },
            { category: 'وەرزشی', url: 'https://www.rudaw.net/sorani/sports/rss' },
            { category: 'ئابووری', url: 'https://www.rudaw.net/sorani/business/rss' }
        ];

        let allNewsData = [];

        async function fetchLiveNews() {
            try {
                let articles = [];
                for (let source of newsSources) {
                    const res = await fetch(proxy + encodeURIComponent(source.url));
                    const textData = await res.text();
                    
                    // پارسکردنی XML/RSS
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(textData, "text/xml");
                    const items = xml.querySelectorAll("item");

                    items.forEach(item => {
                        const title = item.querySelector("title") ? item.querySelector("title").textContent : '';
                        const link = item.querySelector("link") ? item.querySelector("link").textContent : '';
                        const pubDate = item.querySelector("pubDate") ? item.querySelector("pubDate").textContent : '';
                        
                        // دەرهێنانی وێنە لە ناو کانتێنتەکە
                        let imgUrl = 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=1000';
                        const media = item.querySelector("enclosure") || item.querySelector("content");
                        if(media && media.getAttribute("url")) {
                            imgUrl = media.getAttribute("url");
                        }

                        if(title) {
                            articles.push({
                                title: title,
                                category: source.category,
                                time: pubDate ? new Date(pubDate).toLocaleTimeString('ckb', {hour: '2-digit', minute:'2-digit'}) : 'تازە',
                                publisher: 'APT Live',
                                image: imgUrl,
                                link: link,
                                likes: Math.floor(Math.random() * 300) + 20
                            });
                        }
                    });
                }

                allNewsData = articles;
                document.getElementById('loader').style.display = 'none';
                renderNews(allNewsData);

            } catch (err) {
                document.getElementById('loader').innerHTML = 'کێشەیەک لە ڕابەستندا هەیە.<br>تکایە لاپەڕەکە ڕیفرێش بکەرەوە.';
            }
        }

        function renderNews(list) {
            const container = document.getElementById('newsFeed');
            container.innerHTML = '';
            
            if(list.length === 0) {
                container.innerHTML = '<div class="loader">هیچ هەواڵێک بەردەست نییە</div>';
                return;
            }

            list.forEach(news => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <img class="news-bg" src="${news.image}" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=1000'">
                    <div class="overlay"></div>
                    <div class="news-details">
                        <div>
                            <span class="badge">${news.category}</span>
                            <span class="news-time">${news.time}</span>
                        </div>
                        <div class="publisher">${news.publisher}</div>
                        <div class="news-title">${news.title}</div>
                    </div>
                    <div class="action-bar">
                        <button class="action-btn" onclick="this.querySelector('i').classList.toggle('bi-heart-fill'); this.querySelector('i').style.color='#ff3b30';">
                            <i class="bi bi-heart"></i>
                            <span>${news.likes}</span>
                        </button>
                        <button class="action-btn" onclick="window.open('${news.link}', '_blank')">
                            <i class="bi bi-box-arrow-up-right"></i>
                            <span>سەرچاوە</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterNews(cat, el) {
            document.querySelectorAll('.nav-tabs li').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            if(cat === 'گشتی') renderNews(allNewsData);
            else renderNews(allNewsData.filter(i => i.category === cat));
        }

        fetchLiveNews();
        // نوێکردنەوەی ئۆتۆماتیکی چرکە بە چرکە یان خولەک بە خولەک
        setInterval(fetchLiveNews, 15000); 
    </script>
</body>
</html>
