<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus - هەواڵەکان</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding-bottom: 40px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 15px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Live Video Section */
    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-color);
    }

    .live-badge {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .live-stream-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      border: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .live-stream-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Search Bar Section */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-input {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 15px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .btn-quick-search {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-quick-search:hover {
      border-color: var(--accent-color);
      color: #fff;
    }

    .quick-tags {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    /* News Feed Section */
    .news-grid {
      display: grid;
      gap: 15px;
    }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      text-decoration: none;
      color: #fff;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    .news-card img {
      width: 110px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .news-title {
      font-size: 14px;
      line-height: 1.4;
      color: #f1f1f1;
    }

    .news-date {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .loading, .error {
      text-align: center;
      padding: 30px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">
        <span>APT M Plus</span>
      </div>
    </header>

    <!-- 1. لایڤی ڕاستەوخۆ -->
    <div class="section-title">
      <span>پەخشی ڕاستەوخۆی کوردستان ٢٤</span>
      <span class="live-badge">LIVE</span>
    </div>
    <div class="live-stream-container">
      <iframe 
        src="https://www.youtube.com/embed/live_stream?channel=UCvM_L84C7G9C9y_vGv8N7vA" 
        title="Kurdistan24 Live" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- 2. گەڕان بەدوای هەواڵ (تایبەت بە مووچە) -->
    <div class="section-title">گەڕان بەدوای هەواڵەکان</div>
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="گەڕان بەدوای هەواڵ (بۆ نموونە: مووچە)..." oninput="filterNews()">
    </div>
    <div class="quick-tags" style="margin-top: -15px; margin-bottom: 20px;">
      <button class="btn-quick-search" onclick="setSearch('مووچە')"># مووچە</button>
      <button class="btn-quick-search" onclick="setSearch('کوردستان')"># کوردستان</button>
      <button class="btn-quick-search" onclick="setSearch('')">هەموی</button>
    </div>

    <!-- 3. هەواڵی خێرا / هەموو هەواڵەکان -->
    <div class="section-title">دوایین هەواڵە خێراکان</div>
    <div id="loading" class="loading">داگرتنی هەواڵەکان...</div>
    <div id="error" class="error" style="display: none; color: var(--accent-color);"></div>
    <div id="newsContainer" class="news-grid"></div>
  </div>

  <script>
    let allNews = [];

    const RSS_URL = 'https://www.kurdistan24.net/ku/rss';
    const API_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(RSS_URL)}`;

    // داگرتنی هەواڵەکان لە RSS
    fetch(API_URL)
      .then(res => {
        if (!res.ok) throw new Error('کێشە لە پەیوەندی هەیە');
        return res.json();
      })
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data.contents, "text/xml");
        const items = xmlDoc.querySelectorAll("item");

        items.forEach(item => {
          const title = item.querySelector("title")?.textContent || '';
          const link = item.querySelector("link")?.textContent || '#';
          const pubDateRaw = item.querySelector("pubDate")?.textContent || '';
          
          let mediaUrl = '';
          const media = item.getElementsByTagName("media:content")[0] || item.getElementsByTagName("enclosure")[0];
          if (media) {
            mediaUrl = media.getAttribute("url");
          }

          allNews.push({
            title,
            link,
            pubDate: pubDateRaw ? new Date(pubDateRaw).toLocaleDateString('ckb-IQ', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' }) : '',
            image: mediaUrl
          });
        });

        renderNews(allNews);
      })
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        const errDiv = document.getElementById('error');
        errDiv.style.display = 'block';
        errDiv.innerText = 'نەتوانرا هەواڵەکان باربکرێن. تکایە هێڵی ئینتەرنێتەکەت بپشکنە.';
      });

    // پێشاندانی هەواڵەکان لەسەر شاشە
    function renderNews(newsList) {
      const container = document.getElementById('newsContainer');
      container.innerHTML = '';

      if (newsList.length === 0) {
        container.innerHTML = '<div class="loading">هیچ هەواڵێک بەم ناونیشانە نەدۆزرایەوە.</div>';
        return;
      }

      newsList.forEach(item => {
        const card = document.createElement('a');
        card.className = 'news-card';
        card.href = item.link;
        card.target = '_blank';

        const imgHtml = item.image ? `<img src="${item.image}" alt="${item.title}">` : '<div style="width:110px;height:80px;background:#222;border-radius:6px;"></div>';

        card.innerHTML = `
          ${imgHtml}
          <div class="news-content">
            <h2 class="news-title">${item.title}</h2>
            <span class="news-date">${item.pubDate}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // گەڕان بەدوای هەواڵدا
    function filterNews() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allNews.filter(item => item.title.toLowerCase().includes(query));
      renderNews(filtered);
    }

    // دوگمەی خێرای گەڕان (بۆ مووچە)
    function setSearch(term) {
      document.getElementById('searchInput').value = term;
      filterNews();
    }
  </script>
</body>
</html>
