<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 15px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    /* هێدەری جێگیر */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); }
    
    .live-tag {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* بەشی گەڕان */
    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent-color); }

    .search-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    /* داڕشتنی سەرەکی: بەشەکان لە ڕاست + هەواڵەکان لە چەپ */
    .main-layout {
      display: flex;
      gap: 15px;
      align-items: flex-start;
    }

    /* بەشەکان (لە لای ڕاست و لە خوار یەک) */
    .sidebar-categories {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 140px;
      flex-shrink: 0;
    }

    .cat-btn {
      background-color: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      text-align: right;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* ناوەڕۆکی هەواڵەکان */
    .feed-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .news-card img {
      width: 85px;
      height: 65px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background-color: #1e222d;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .news-source {
      font-size: 11px;
      color: var(--accent-color);
      font-weight: bold;
    }

    .news-title {
      font-size: 13px;
      line-height: 1.4;
      color: #f1f1f1;
      margin-top: 2px;
    }

    .news-date {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .status-msg { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 13px; width: 100%; }

    /* گونجاندنی شاشەی موبایل (دەبێتە سەر و خوار لە شاشەی زۆر بچووک) */
    @media (max-width: 480px) {
      .main-layout {
        flex-direction: column;
      }
      .sidebar-categories {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
      }
      .cat-btn {
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">APT M Plus</div>
      <div class="live-tag">LIVE</div>
    </header>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="گەڕان بەدوای هەواڵدا...">
      <button class="search-btn" onclick="executeSearch()">سێرچ</button>
    </div>

    <div class="main-layout">
      <!-- بەشەکان لە لای ڕاست لە خوار یەک -->
      <aside class="sidebar-categories">
        <button class="cat-btn active" onclick="switchCategory('all', this)">هەمووی</button>
        <button class="cat-btn" onclick="switchCategory('local', this)">هەواڵی ناوخۆیی</button>
        <button class="cat-btn" onclick="switchCategory('world', this)">هەواڵی جیهانی</button>
        <button class="cat-btn" onclick="switchCategory('sports', this)">هەواڵی وەرزشی</button>
        <button class="cat-btn" onclick="switchCategory('economy', this)">هەواڵی ئابووری</button>
      </aside>

      <!-- بەشی پێشاندانی هەواڵەکان -->
      <main class="feed-container" id="feedContainer">
        <div id="status" class="status-msg">بارکردنی هەواڵەکان...</div>
      </main>
    </div>
  </div>

  <script>
    let allArticles = [];

    async function loadNews() {
      const statusEl = document.getElementById('status');
      try {
        const res = await fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://www.rudaw.net/sorani/rss'));
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const items = xmlDoc.querySelectorAll("item");

        allArticles = [];
        items.forEach((item, index) => {
          if (index >= 20) return;

          const title = item.querySelector("title")?.textContent || '';
          const link = item.querySelector("link")?.textContent || '#';
          const pubDateRaw = item.querySelector("pubDate")?.textContent || '';
          const enclosure = item.querySelector("enclosure");
          const imgUrl = enclosure ? enclosure.getAttribute("url") : '';

          allArticles.push({
            title,
            link,
            img: imgUrl,
            date: pubDateRaw ? new Date(pubDateRaw) : new Date()
          });
        });

        renderNews(allArticles);
      } catch (err) {
        if(statusEl) statusEl.innerText = 'کێشەیەک لە بارکردنی هەواڵەکان ڕوویدا.';
      }
    }

    function renderNews(articles) {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      if (articles.length === 0) {
        container.innerHTML = '<div class="status-msg">هیچ هەواڵێک نەدۆزرایەوە.</div>';
        return;
      }

      articles.forEach(art => {
        const card = document.createElement('a');
        card.className = 'news-card';
        card.href = art.link;
        card.target = '_blank';

        const pubDate = art.date.toLocaleString('ckb-IQ', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
        const imgHtml = art.img ? `<img src="${art.img}" alt="news">` : '<div style="width:85px;height:65px;background:#1e222d;border-radius:8px;flex-shrink:0;"></div>';

        card.innerHTML = `
          ${imgHtml}
          <div class="news-content">
            <div>
              <span class="news-source">ڕووداو</span>
              <h2 class="news-title">${art.title}</h2>
            </div>
            <span class="news-date">${pubDate}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        renderNews(allArticles);
        return;
      }
      const filtered = allArticles.filter(art => art.title.toLowerCase().includes(query));
      renderNews(filtered);
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') executeSearch();
    });

    function switchCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderNews(allArticles);
    }

    loadNews();
  </script>
</body>
</html>
