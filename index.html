<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus - Ultra Live AI News</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 12px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 6px; }
    
    .live-badge {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-right: 4px solid var(--accent-color);
      text-decoration: none;
      color: #fff;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .news-title {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .news-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 10px;
      color: #e2001a;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">
        APT M Plus
        <span style="font-size: 10px; border: 1px solid var(--accent-color); padding: 2px 5px; border-radius: 4px;">Real-Time AI</span>
      </div>
      <div class="live-badge">🔴 چرکە بە چرکە LIVE</div>
    </header>

    <main class="feed-container" id="feedContainer">
      <div class="status" id="status">پەیوەستبوون بە سێرڤەری ڕاستەوخۆ...</div>
    </main>
  </div>

  <script>
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);

    const feedContainer = document.getElementById('feedContainer');
    const statusEl = document.getElementById('status');

    ws.onopen = () => {
      statusEl.innerText = 'پەیوەست بوو! چاوەڕێی هەواڵی نوێ بکه...';
    };

    ws.onmessage = (event) => {
      const news = JSON.parse(event.data);
      
      if (statusEl) statusEl.remove();

      const card = document.createElement('a');
      card.className = 'news-card';
      card.href = news.link;
      card.target = '_blank';

      card.innerHTML = `
        <div class="news-title">${news.title}</div>
        <div class="news-desc">${news.summary}</div>
        <div class="news-meta">
          <span>✨ پوختەکراو بە Gemini AI</span>
          <span>${news.time}</span>
        </div>
      `;

      feedContainer.insertBefore(card, feedContainer.firstChild);
    };

    ws.onclose = () => {
      if (statusEl) statusEl.innerText = 'پەیوەندی پچڕا. هەوڵی بەستنەوە دەدرێتەوە...';
    };
  </script>
</body>
</html>
