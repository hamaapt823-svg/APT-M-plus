<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APT Media</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background-color: #111;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        h1 {
            color: #fff;
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        /* مینیوی بەشەکان */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 10px;
            overflow-x: auto;
            max-width: 600px;
            white-space: nowrap;
        }
        .category-btn {
            background-color: #222;
            color: #ccc;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .category-btn.active, .category-btn:hover {
            background-color: #e50914;
            color: #fff;
        }
        #news-container {
            width: 100%;
            max-width: 500px;
            padding: 20px 10px;
        }
        .news-item {
            background-color: #1a1a1a;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .news-tag {
            background-color: #333;
            color: #e50914;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }
        .news-item h3 {
            margin: 0 0 10px 0;
            color: #fff;
            font-size: 18px;
        }
        .news-item p {
            margin: 0 0 15px 0;
            color: #d1d1d1;
            font-size: 15px;
            line-height: 1.5;
        }
        .news-item small {
            color: #888;
            font-size: 12px;
        }
        .loading {
            text-align: center;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>APT Media</h1>
        <div class="categories">
            <button class="category-btn active" onclick="filterNews('هەموو', this)">گشتی</button>
            <button class="category-btn" onclick="filterNews('ناوخۆیی', this)">ناوخۆیی</button>
            <button class="category-btn" onclick="filterNews('وەرزشی', this)">وەرزشی</button>
            <button class="category-btn" onclick="filterNews('تەکنەلۆژیا', this)">تەکنەلۆژیا</button>
        </div>
    </header>

    <div id="news-container">
        <div class="loading">چاوەڕێ بکە، زانیارییەکان باردەکرێن...</div>
    </div>

    <script>
        let allNewsData = [];

        async function fetchNews() {
            const container = document.getElementById('news-container');
            
            try {
                const response = await fetch('/api/news');
                const result = await response.json();
                allNewsData = result.data || [];

                displayNews(allNewsData);
            } catch (error) {
                container.innerHTML = '<div class="loading" style="color:#ff4d4d;">کێشە لە هێنانی زانیارییەکان هەیە.</div>';
            }
        }

        function displayNews(newsArray) {
            const container = document.getElementById('news-container');
            if (newsArray.length === 0) {
                container.innerHTML = '<div class="loading">هیچ هەواڵێک لەم بەشەدا نییە.</div>';
                return;
            }

            container.innerHTML = '';
            newsArray.forEach(news => {
                const newsDiv = document.createElement('div');
                newsDiv.className = 'news-item';
                newsDiv.innerHTML = `
                    <span class="news-tag">${news.category || 'گشتی'}</span>
                    <h3>${news.title}</h3>
                    <p>${news.content}</p>
                    <small>${news.date}</small>
                `;
                container.appendChild(newsDiv);
            });
        }

        function filterNews(category, btn) {
            // گۆڕینی ڕەنگی دوگمە چالاکەکان
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (category === 'هەموو') {
                displayNews(allNewsData);
            } else {
                const filtered = allNewsData.filter(item => item.category === category);
                displayNews(filtered);
            }
        }

        window.onload = fetchNews;
    </script>

</body>
</html>
