<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APT Media</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
        body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        
        header { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); 
            padding: 15px 0 10px; text-align: center; 
        }
        .logo { color: #ff3b30; font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .nav-tabs { display: flex; justify-content: center; gap: 15px; list-style: none; overflow-x: auto; padding: 0 10px; }
        .nav-tabs li { font-size: 15px; color: #aaa; cursor: pointer; padding-bottom: 5px; white-space: nowrap; }
        .nav-tabs li.active { color: #fff; font-weight: bold; border-bottom: 3px solid #ff3b30; }

        .app-container { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; }
        
        .news-card { 
            height: 100vh; width: 100vw; scroll-snap-align: start; 
            position: relative; background-color: #111; display: flex; align-items: center; justify-content: center; 
        }
        .news-bg { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.65); }
        .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 15%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.6) 100%); }
        
        .news-details { position: absolute; bottom: 40px; right: 80px; left: 20px; z-index: 10; }
        .badge { background-color: #ff3b30; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .news-time { font-size: 12px; color: #ccc; margin-right: 8px; }
        .publisher { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: #ff3b30; }
        .news-title { font-size: 18px; line-height: 1.5; color: #fff; font-weight: 600; }
        
        .action-bar { position: absolute; bottom: 50px; right: 15px; z-index: 10; display: flex; flex-direction: column; gap: 22px; align-items: center; }
        .action-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 26px; }
        .action-btn span { font-size: 12px; color: #ddd; }
        .action-btn.liked i { color: #ff3b30; }

        .live-indicator {
            position: absolute; top: 75px; left: 15px; z-index: 100;
            background: rgba(255, 59, 48, 0.2); border: 1px solid #ff3b30;
            color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px;
            display: flex; align-items: center; gap: 6px;
        }
        .dot { width: 8px; height: 8px; background-color: #ff3b30; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">APT Media</div>
        <ul class="nav-tabs">
            <li class="active" onclick="filterNews('گشتی', this)">گشتی</li>
            <li onclick="filterNews('ناوخۆیی', this)">ناوخۆیی</li>
            <li onclick="filterNews('وەرزشی', this)">وەرزشی</li>
            <li onclick="filterNews('ئابووری', this)">ئابووری</li>
        </ul>
    </header>

    <div class="live-indicator">
        <div class="dot"></div> ڕاستەوخۆ (چرکە بە چرکە)
    </div>

    <div class="app-container" id="newsFeed"></div>

    <script>
        // داتای سەرەتایی هەواڵەکان
        let newsDatabase = [
            { id: 1, title: 'کەشناسی هەرێم: شەپۆلێکی سەرما و بارانبارین زۆربەی ناوچەکان دەگرێتەوە.', category: 'ناوخۆیی', time: 'تازە', publisher: 'APT Local', image: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=800', likes: 120 },
            { id: 2, title: 'یارییەکانی قۆناغی داهاتووی خولی پاڵەوانەکان دیاری کران.', category: 'وەرزشی', time: 'پێش ٢ خولەک', publisher: 'APT Sport', image: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800', likes: 450 },
            { id: 3, title: 'بەرزبوونەوەی نوێ لە نرخەکانی نەوت و زێڕ لە بازاڕە جیهانییەکان.', category: 'ئابووری', time: 'پێش ٥ خولەک', publisher: 'APT Economy', image: 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=800', likes: 210 },
            { id: 4, title: 'کۆبوونەوەی لوپوتکەی جیهانی ئابووری دەستی پێکرد.', category: 'گشتی', time: 'پێش ١٠ خولەک', publisher: 'APT Global', image: 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800', likes: 89 }
        ];

        let currentCategory = 'گشتی';

        function renderNews() {
            const container = document.getElementById('newsFeed');
            container.innerHTML = '';

            let filtered = currentCategory === 'گشتی' 
                ? newsDatabase 
                : newsDatabase.filter(item => item.category === currentCategory);

            filtered.forEach(news => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <img class="news-bg" src="${news.image}" alt="news">
                    <div class="overlay"></div>
                    <div class="news-details">
                        <div>
                            <span class="badge">${news.category}</span>
                            <span class="news-time">${news.time}</span>
                        </div>
                        <div class="publisher">${news.publisher}</div>
                        <div class="news-title">${news.title}</div>
                    </div>
                    <div class="action-bar">
                        <button class="action-btn" onclick="toggleLike(this)">
                            <i class="bi bi-heart-fill"></i>
                            <span class="like-count">${news.likes}</span>
                        </button>
                        <button class="action-btn" onclick="alert('لینکەکە کۆپی کرا')">
                            <i class="bi bi-share-fill"></i>
                            <span>شێر</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterNews(cat, el) {
            document.querySelectorAll('.nav-tabs li').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            currentCategory = cat;
            renderNews();
        }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
            let countSpan = btn.querySelector('.like-count');
            let val = parseInt(countSpan.innerText);
            countSpan.innerText = btn.classList.contains('liked') ? val + 1 : val - 1;
        }

        // 🤖 ژیری دەستکرد / ڕەشنووسی زیند و (چرکە بە چرکە هەواڵی نوێ دروست دەکات و زیادی دەکات)
        const categories = ['ناوخۆیی', 'وەرزشی', 'ئابووری', 'گشتی'];
        const sampleTitles = [
            'بڕیارێکی نوێ لەبارەی ئاسانکاری بۆ مامەڵەی هاووڵاتییان دەرچوو.',
            'تیمەکانی فریاگوزاری لە حاڵەتی ئامادەباشیی تەواودان.',
            'یاریزانێکی دیار گرێبەستێکی نوێی ئیمزا کرد.',
            'بازاڕی دراوە دیجیتاڵییەکان گۆڕانکاریی گەورەی بەخۆیەوە بینی.',
            'پڕۆژەیەکی نوێی خزمەتگوزاری لە هەرێمی کوردستان ڕاگەیەندرا.'
        ];

        function autoGenerateLiveNews() {
            const randomCat = categories[Math.floor(Math.random() * categories.length)];
            const randomTitle = sampleTitles[Math.floor(Math.random() * sampleTitles.length)];
            
            const newArticle = {
                id: Date.now(),
                title: randomTitle,
                category: randomCat,
                time: 'ئێستا (نوێ)',
                publisher: 'APT Live AI',
                image: 'https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800',
                likes: Math.floor(Math.random() * 50) + 1
            };

            // خستنەسەری بۆ سەرەوەی لیستی هەواڵەکان
            newsDatabase.unshift(newArticle);
            renderNews();
        }

        // یەکەم جار ڕەندەر کردنی داتا
        renderNews();

        // هەر ١٠ چڕکە جارێک هەواڵێکی نوێی زێنەو دەچێتە ناو ئەپەکەتەوە بەبێ ریفرێش
        setInterval(autoGenerateLiveNews, 10000);
    </script>
</body>
</html>
