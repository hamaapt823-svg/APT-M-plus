<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus - AI Powered</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 12px;
    }

    .container { max-width: 850px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 6px; }
    .ai-badge { background-color: #ffffff15; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--accent-color); }
    
    .live-tag {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 10px 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent-color); }

    .search-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .main-layout {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .sidebar-categories {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 130px;
      flex-shrink: 0;
    }

    .cat-btn {
      background-color: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 12px;
      text-align: right;
      cursor: pointer;
    }

    .cat-btn.active, .cat-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .feed-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      position: relative;
    }

    .news-card img {
      width: 95px;
      height: 75px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background-color: #1e222d;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .news-title {
      font-size: 13px;
      font-weight: bold;
      line-height: 1.4;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .news-desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ai-tag {
      font-size: 9px;
      color: #e2001a;
      font-weight: bold;
      margin-top: 4px;
      display: inline-block;
    }

    .status-msg { text-align: center; padding: 25px; color: var(--text-secondary); font-size: 13px; width: 100%; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">
        APT M Plus
        <span class="ai-badge">AI Powered</span>
      </div>
      <div class="live-tag">LIVE</div>
    </header>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="گەڕان بەدوای هەواڵدا...">
      <button class="search-btn" onclick="executeSearch()">سێرچ</button>
    </div>

    <div class="main-layout">
      <aside class="sidebar-categories">
        <button class="cat-btn active" onclick="loadNews('all', this)">هەمووی</button>
        <button class="cat-btn" onclick="loadNews('local', this)">هەواڵی ناوخۆیی</button>
        <button class="cat-btn" onclick="loadNews('world', this)">هەواڵی جیهانی</button>
        <button class="cat-btn" onclick="loadNews('sports', this)">هەواڵی وەرزشی</button>
      </aside>

      <main class="feed-container" id="feedContainer">
        <div class="status-msg">زیرەکی دەستکرد لە حالەتی داڕشتن و بارکردنی هەواڵەکاندایە...</div>
      </main>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = 'AQ.Ab8RN6KWk_mys4tVPFGus530lSxyLT1s5q1cxzudC5ncNMtywQ';
    let articlesCache = [];

    async function summarizeWithAI(text) {
      if (!text || text.length < 20) return text;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `ئەم دەقەی خوارەوە بە شێوەیەکی کورت و زۆر ڕەوان بە زمانی کوردی سۆرانی پوخت بکەرەوە لە یەک ڕستەدا:\n\n${text}`
              }]
            }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          return data.candidates[0].content.parts[0].text.trim();
        }
        return text.slice(0, 110) + '...';
      } catch (e) {
        return text.slice(0, 110) + '...';
      }
    }

    async function loadNews() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '<div class="status-msg">زیرەکی دەستکرد لە حالەتی داڕشتن و بارکردنی هەواڵەکاندایە...</div>';

      const targetUrl = encodeURIComponent('https://www.awene.com/rss');
      const apiUrl = `https://api.allorigins.win/get?url=${targetUrl}`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        
        if (data.contents) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(data.contents, "text/xml");
          const items = xmlDoc.querySelectorAll("item");

          articlesCache = [];
          const rawArticles = Array.from(items).slice(0, 10);

          for (const item of rawArticles) {
            const title = item.querySelector("title")?.textContent || "";
            const link = item.querySelector("link")?.textContent || "#";
            const rawDesc = item.querySelector("description")?.textContent || "";
            
            const temp = document.createElement("div");
            temp.innerHTML = rawDesc;
            const cleanText = temp.textContent || temp.innerText || "";
            const imgMatch = rawDesc.match(/src=["']([^"']+)["']/);
            const img = imgMatch ? imgMatch[1] : "";

            const aiSummary = await summarizeWithAI(cleanText);

            articlesCache.push({
              title: title.trim(),
              link: link.trim(),
              description: aiSummary,
              img: img
            });
          }

          displayArticles(articlesCache);
        } else {
          container.innerHTML = '<div class="status-msg">هیچ هەواڵێک نەدۆزرایەوە.</div>';
        }
      } catch (err) {
        container.innerHTML = '<div class="status-msg">کێشە لە بارکردنی هەواڵەکان دروست بوو.</div>';
      }
    }

    function displayArticles(articles) {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      if (articles.length === 0) {
        container.innerHTML = '<div class="status-msg">هیچ هەواڵێک بەردەست نییە.</div>';
        return;
      }

      articles.forEach(art => {
        const card = document.createElement('a');
        card.className = 'news-card';
        card.href = art.link;
        card.target = '_blank';

        const imgTag = art.img 
          ? `<img src="${art.img}" alt="news" onerror="this.style.display='none'">` 
          : '<div style="width:95px;height:75px;background:#1e222d;border-radius:6px;flex-shrink:0;"></div>';

        card.innerHTML = `
          ${imgTag}
          <div class="news-content">
            <div>
              <h2 class="news-title">${art.title}</h2>
              <p class="news-desc">${art.description}</p>
            </div>
            <span class="ai-tag">✨ پوختەکراو بە AI</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        displayArticles(articlesCache);
        return;
      }

      const filtered = articlesCache.filter(item => 
        item.title.toLowerCase().includes(query) || 
        item.description.toLowerCase().includes(query)
      );
      displayArticles(filtered);
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeSearch();
    });

    loadNews();
  </script>
</body>
</html>
