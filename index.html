<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کوردستان ٢٤ - هەواڵەکان</title>
  <style>
    body {
      background-color: #090a0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      border-bottom: 2px solid #e2001a;
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      color: #e2001a;
      margin: 0;
      font-size: 22px;
    }
    .badge {
      font-size: 12px;
      background: #e2001a;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .news-grid {
      display: grid;
      gap: 15px;
    }
    .news-card {
      background-color: #161922;
      border-radius: 8px;
      padding: 15px;
      text-decoration: none;
      color: #fff;
      border: 1px solid #2a2e3d;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .news-card img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 6px;
    }
    .news-card h2 {
      font-size: 17px;
      margin: 0;
      line-height: 1.5;
      color: #f1f1f1;
    }
    .news-card span {
      font-size: 12px;
      color: #888;
    }
    .loading, .error {
      text-align: center;
      margin-top: 40px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>کوردستان ٢٤ - دوایین هەواڵەکان</h1>
      <span class="badge">ڕاستەوخۆ</span>
    </header>

    <div id="loading" class="loading">داگرتنی هەواڵەکان...</div>
    <div id="error" class="error" style="display: none; color: #ff4d4d;"></div>
    <div id="news-container" class="news-grid"></div>
  </div>

  <script>
    const RSS_URL = 'https://www.kurdistan24.net/ku/rss';
    // بەکارهێنانی پراکسی allorigins بۆ تێپەڕاندنی کێشەی CORS
    const API_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(RSS_URL)}`;

    fetch(API_URL)
      .then(res => {
        if (!res.ok) throw new Error('کێشە لە ڕاوبۆچوونی سەرڤەر ڕوویدا');
        return res.json();
      })
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        
        // Parsing کردنی XML ی RSS
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data.contents, "text/xml");
        const items = xmlDoc.querySelectorAll("item");

        if (items.length === 0) {
          throw new Error('هیچ هەواڵێک نەدۆزرایەوە');
        }

        const container = document.getElementById('news-container');

        items.forEach(item => {
          const title = item.querySelector("title")?.textContent || '';
          const link = item.querySelector("link")?.textContent || '#';
          const pubDateRaw = item.querySelector("pubDate")?.textContent || '';
          
          // وەرگرتنی وێنە لە ناو RSS
          let mediaUrl = '';
          const media = item.getElementsByTagName("media:content")[0] || item.getElementsByTagName("enclosure")[0];
          if (media) {
            mediaUrl = media.getAttribute("url");
          }

          const card = document.createElement('a');
          card.className = 'news-card';
          card.href = link;
          card.target = '_blank';

          const imgHtml = mediaUrl ? `<img src="${mediaUrl}" alt="${title}">` : '';
          const pubDate = pubDateRaw ? new Date(pubDateRaw).toLocaleString('ckb-IQ') : '';

          card.innerHTML = `
            ${imgHtml}
            <h2>${title}</h2>
            <span>${pubDate}</span>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        const errDiv = document.getElementById('error');
        errDiv.style.display = 'block';
        errDiv.innerText = 'کێشەیەک ڕوویدا: نەتوانرا بەستەرەکە باربکرێت';
      });
  </script>
</body>
</html>
