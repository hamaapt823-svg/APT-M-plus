<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus - AKB Media</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #24A1DE;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 15px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .badge {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .feed-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .post-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      border: 1px solid var(--border-color);
      line-height: 1.6;
      font-size: 14px;
      word-break: break-word;
    }

    .post-date {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 10px;
      display: block;
    }

    .loading, .error {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .btn-telegram {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--accent-color);
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">APT M Plus</div>
      <div class="badge">AKB Media</div>
    </header>

    <div id="loading" class="loading">داگرتنی پۆستەکان...</div>
    <div id="error" class="error" style="display: none; color: #ff4d4d;"></div>
    <div id="feedContainer" class="feed-grid"></div>

    <a href="https://t.me/akb_media" target="_blank" class="btn-telegram">
      سەردانی کەناڵی فەرمی AKB Media لە تیلیگرام بکە
    </a>
  </div>

  <script>
    // بەکارهێنانی سەرڤەری بەهێزی RSSBridge
    const RSS_URL = 'https://rssbridge.pro/bridge?action=display&bridge=TelegramBridge&username=akb_media&format=Atom';
    const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

    async function loadTelegramFeed() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        document.getElementById('loading').style.display = 'none';

        if (data.status === 'ok' && data.items && data.items.length > 0) {
          const container = document.getElementById('feedContainer');

          data.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'post-card';

            const pubDate = item.pubDate ? new Date(item.pubDate).toLocaleString('ckb-IQ') : '';

            card.innerHTML = `
              <div>${item.content || item.description || item.title}</div>
              <span class="post-date">${pubDate}</span>
            `;
            container.appendChild(card);
          });
        } else {
          // ئەگەر APIەکە هەڵەی دادا، ئامرازی جێگرەوە جێبەجێ بکه
          showFallbackFeed();
        }
      } catch (err) {
        showFallbackFeed();
      }
    }

    function showFallbackFeed() {
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('feedContainer');
      container.innerHTML = `
        <div class="post-card" style="text-align: center;">
          <p style="margin-bottom: 10px;">بۆ دیداری ڕاستەوخۆی گشت پۆستەکان بە وێنە و ڤیدیۆوە:</p>
          <a href="https://t.me/s/akb_media" target="_blank" style="color: var(--accent-color); font-weight: bold; text-decoration: none;">
            کلیک لەم بەستەرە بکە بۆ بازدانی ڕاستەوخۆ
          </a>
        </div>
      `;
    }

    loadTelegramFeed();
  </script>
</body>
</html>
