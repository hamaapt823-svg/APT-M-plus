<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus - پەیجی فەیسبووک</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 15px;
      margin: 0;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
      text-align: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .fb-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Facebook SDK -->
  <div id="fb-root"></div>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/ckb_IQ/sdk.js#xfbml=1&version=v18.0"></script>

  <div class="container">
    <header>
      <div class="logo">APT M Plus - دوایین پۆستەکان</div>
    </header>

    <!-- Facebook Feed Widget -->
    <div class="fb-container">
      <div class="fb-page" 
        data-href="https://www.facebook.com/share/1Az35L1w99/" 
        data-tabs="timeline" 
        data-width="500" 
        data-height="800" 
        data-small-header="false" 
        data-adapt-container-width="true" 
        data-hide-cover="false" 
        data-show-facepile="true">
        <blockquote cite="https://www.facebook.com/share/1Az35L1w99/" class="fb-xfbml-parse-ignore">
          <a href="https://www.facebook.com/share/1Az35L1w99/">داگرتنی پۆستەکان...</a>
        </blockquote>
      </div>
    </div>
  </div>

</body>
</html>
