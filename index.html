<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurdistan+ | کوردستانی پڵەس</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap');
        body {
            font-family: 'Noto Naskh Arabic', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .news-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
        }
        .news-card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-xl font-bold">
                    K+
                </div>
                <h1 class="text-2xl font-bold text-blue-400">Kurdistan+</h1>
            </div>
            
            <div class="flex-1 max-w-md mx-4">
                <input type="text" id="searchInput" onkeyup="filterNews()" placeholder="گەڕان لە هەواڵەکان..." 
                    class="w-full bg-slate-800 border border-slate-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
            </div>

            <div class="flex items-center space-x-2 space-x-reverse">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-500/10 text-green-400">
                    <span class="w-2 h-2 mr-1 bg-green-500 rounded-full animate-pulse ml-1"></span> ڕاستەوخۆ
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        
        <!-- AI Summary Section -->
        <section class="mb-8">
            <h2 class="text-xl font-bold text-slate-200 mb-4 flex items-center">
                <svg class="w-5 h-5 ml-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                پوختەی ڕۆژنامەوانی AI
            </h2>
            <div id="aiSummary" class="bg-slate-800/60 border border-slate-700 rounded-xl p-5 text-slate-300 leading-relaxed min-h-[80px]">
                چاوەڕوانی بەستنەوەی سێرڤەر و ئامادەکردنی پوختەی هەواڵەکان...
            </div>
        </section>

        <!-- General News Feed Section -->
        <section>
            <h2 class="text-xl font-bold text-slate-200 mb-4">گشت هەواڵە زیندوەکان</h2>
            <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- News items will be populated here dynamically -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-slate-500 text-sm">
        کوردستانی پڵەس &copy; 2026 - تەواوی مافەکانی پارێزراوە
    </footer>

    <!-- WebSocket & Logic Script -->
    <script>
        let allNews = [];
        const ws = new WebSocket('wss://65c23c8e-be05-4783-8d39-7bfc1a4148e3-00-huvnkjukli39.pike.replit.dev');

        ws.onopen = () => {
            console.log('پەیوەندی لەگەڵ سێرڤەردا سەرکەوتوو بوو');
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.summary) {
                    document.getElementById('aiSummary').innerText = data.summary;
                }

                if (data.items) {
                    allNews = data.items;
                    renderNews(allNews);
                }
            } catch (err) {
                console.error('کێشە لە خوێندنەوەی دراوەکان:', err);
            }
        };

        function renderNews(items) {
            const newsGrid = document.getElementById('newsGrid');
            newsGrid.innerHTML = '';

            if(items.length === 0) {
                newsGrid.innerHTML = `<div class="col-span-full text-slate-500 text-center py-6">هیچ هەواڵێک نەدۆزرایەوە.</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card p-4 rounded-xl flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="text-xs text-blue-400 mb-2">${item.pubDate || 'نوێترین'}</div>
                        <h3 class="font-bold text-slate-100 mb-2 leading-snug">${item.title}</h3>
                        <p class="text-xs text-slate-400 line-clamp-3 mb-4">${item.contentSnippet || item.snippet || ''}</p>
                    </div>
                    <a href="${item.link}" target="_blank" class="text-xs text-blue-400 hover:underline inline-block mt-auto font-semibold">
                        درێژەی هەواڵ &larr;
                    </a>
                `;
                newsGrid.appendChild(card);
            });
        }

        function filterNews() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allNews.filter(news => 
                news.title.toLowerCase().includes(query) || 
                (news.contentSnippet && news.contentSnippet.toLowerCase().includes(query))
            );
            renderNews(filtered);
        }
    </script>
</body>
</html>
