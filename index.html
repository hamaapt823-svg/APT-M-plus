<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT M Plus</title>
  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #161922;
      --accent-color: #e2001a;
      --border-color: #2a2e3d;
      --text-color: #ffffff;
      --text-secondary: #a0a5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      direction: rtl;
      padding: 12px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); }
    
    .live-tag {
      background-color: var(--accent-color);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-input {
      flex: 1;
      padding: 10px 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent-color); }

    .search-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .main-layout {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .sidebar-categories {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 130px;
      flex-shrink: 0;
    }

    .cat-btn {
      background-color: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 12px;
      text-align: right;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .feed-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .news-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 10px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }

    .news-card img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background-color: #1e222d;
    }

    .news-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .news-source {
      font-size: 10px;
      color: var(--accent-color);
      font-weight: bold;
    }

    .news-title {
      font-size: 12px;
      line-height: 1.4;
      color: #f1f1f1;
      margin-top: 2px;
    }

    .news-date {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .status-msg { text-align: center; padding: 25px; color: var(--text-secondary); font-size: 13px; width: 100%; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">APT M Plus</div>
      <div class="live-tag">LIVE</div>
    </header>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="گەڕان بەدوای هەواڵدا...">
      <button class="search-btn" onclick="executeSearch()">سێرچ</button>
    </div>

    <div class="main-layout">
      <aside class="sidebar-categories">
        <button class="cat-btn active" onclick="switchCategory('all', this)">هەمووی</button>
        <button class="cat-btn" onclick="switchCategory('local', this)">هەواڵی ناوخۆیی</button>
        <button class="cat-btn" onclick="switchCategory('world', this)">هەواڵی جیهانی</button>
        <button class="cat-btn" onclick="switchCategory('sports', this)">هەواڵی وەرزشی</button>
        <button class="cat-btn" onclick="switchCategory('economy', this)">هەواڵی ئابووری</button>
      </aside>

      <main class="feed-container" id="feedContainer">
      </main>
    </div>
  </div>

  <script>
    // داتای سەرەکی هەواڵەکان
    const newsData = [
      {
        id: 1,
        title: "تازەترین گۆڕانکارییەکان لە بازاڕی دراو و نرخی زێڕ لە هەرێم",
        category: "economy",
        source: "ئابووری",
        date: "پێش ٥ خولەک",
        img: "https://picsum.photos/200/150?random=1",
        link: "#"
      },
      {
        id: 2,
        title: "یارییەکانی ئەمشەوی خولی پاڵەوانەکانی ئەوروپا دەستپێدەکاتەوە",
        category: "sports",
        source: "وەرزش",
        date: "پێش ١٥ خولەک",
        img: "https://picsum.photos/200/150?random=2",
        link: "#"
      },
      {
        id: 3,
        title: "کەشوهەوای پارێزگاکانی هەرێم بۆ چەند ڕۆژی داهاتوو ڕاگەیەندرا",
        category: "local",
        source: "ناوخۆیی",
        date: "پێش ٣٠ خولەک",
        img: "https://picsum.photos/200/150?random=3",
        link: "#"
      },
      {
        id: 4,
        title: "کۆبوونەوەی لوتکەی وڵاتانی جیهان سەبارەت بە تەکنەلۆژیا و AI بەڕێوەچوو",
        category: "world",
        source: "جیهانی",
        date: "پێش ١ کاتژمێر",
        img: "https://picsum.photos/200/150?random=4",
        link: "#"
      }
    ];

    let activeCategory = 'all';

    function renderNews(articles) {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      if (articles.length === 0) {
        container.innerHTML = '<div class="status-msg">هیچ هەواڵێک بەردەست نییە.</div>';
        return;
      }

      articles.forEach(art => {
        const card = document.createElement('a');
        card.className = 'news-card';
        card.href = art.link;

        card.innerHTML = `
          <img src="${art.img}" alt="news">
          <div class="news-content">
            <div>
              <span class="news-source">${art.source}</span>
              <h2 class="news-title">${art.title}</h2>
            </div>
            <span class="news-date">${art.date}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = cat;

      if (cat === 'all') {
        renderNews(newsData);
      } else {
        const filtered = newsData.filter(item => item.category === cat);
        renderNews(filtered);
      }
    }

    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      let list = activeCategory === 'all' ? newsData : newsData.filter(i => i.category === activeCategory);

      if (!query) {
        renderNews(list);
        return;
      }

      const filtered = list.filter(art => art.title.toLowerCase().includes(query));
      renderNews(filtered);
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') executeSearch();
    });

    // بارکردنی سەرەتایی
    renderNews(newsData);
  </script>
</body>
</html>
