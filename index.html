<!DOCTYPE html>
<html lang="kmr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APT M+ | هەواڵەکانی ڕووداو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-white font-sans dir-rtl">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [news, setNews] = useState([]);
        const [loading, setLoading] = useState(true);
        const [search, setSearch] = useState('');

        useEffect(() => {
          // هێنانی خۆکارانەی هەواڵە ڕاستەقینەکانی ڕووداو
          const fetchRudawNews = async () => {
            try {
              const res = await fetch(
                'https://api.rss2json.com/v1/api.json?rss_url=https://www.rudaw.net/sorani/rss'
              );
              const data = await res.json();
              if (data.status === 'ok') {
                setNews(data.items);
              }
            } catch (err) {
              console.error('کێشە لە هێنانی هەواڵەکان:', err);
            } finally {
              setLoading(false);
            }
          };

          fetchRudawNews();
        }, []);

        const filteredNews = news.filter(item =>
          item.title.toLowerCase().includes(search.toLowerCase())
        );

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-12 select-none">
            {/* Header */}
            <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
              <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-slate-950 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold text-xl shadow-lg shadow-amber-500/10">
                    ☀
                  </div>
                  <div>
                    <h1 className="text-xl font-bold tracking-wider text-amber-400">APT M+</h1>
                    <p className="text-xs text-slate-400">سەرچاوەی هەواڵەکان: ڕووداو (Rudaw)</p>
                  </div>
                </div>

                <div className="flex gap-1.5 bg-slate-950/60 px-3 py-1.5 rounded-full border border-slate-800">
                  <span className="w-3 h-3 rounded-full bg-[#ED2024]"></span>
                  <span className="w-3 h-3 rounded-full bg-[#FEBD11]"></span>
                  <span className="w-3 h-3 rounded-full bg-[#278E43]"></span>
                </div>
              </div>
            </header>

            {/* Main Section */}
            <main className="max-w-4xl mx-auto px-4 pt-8">
              <div className="text-center">
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 mb-6 text-sm">
                  <span>🔴 live</span>
                  <span>هەواڵە خێراکانی ڕووداو</span>
                </div>

                <h2 className="text-3xl md:text-5xl font-black text-slate-100 mb-6 leading-tight">
                  سەرچاوەی زانیاری و هەواڵە خێراکان
                </h2>

                {/* Search Bar */}
                <div className="relative max-w-xl mx-auto mb-8">
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="گەڕان لە ناو هەواڵەکانی ڕووداودا..."
                    className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-4 px-5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 shadow-xl transition"
                  />
                </div>
              </div>

              {/* Feed Display */}
              {loading ? (
                <div className="text-center py-20 text-amber-400 animate-pulse font-bold">
                  خەریکی بارکردنی نوێترین هەواڵەکانی ڕووداوە...
                </div>
              ) : (
                <div className="grid md:grid-cols-2 gap-6 text-right">
                  {filteredNews.length > 0 ? (
                    filteredNews.map((item, index) => (
                      <a
                        key={index}
                        href={item.link}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden hover:border-amber-500/50 hover:bg-slate-900 transition active:scale-[0.98] flex flex-col justify-between group shadow-lg"
                      >
                        {item.enclosure && item.enclosure.link && (
                          <img
                            src={item.enclosure.link}
                            alt={item.title}
                            className="w-full h-48 object-cover group-hover:scale-105 transition duration-300"
                          />
                        )}
                        <div className="p-5 flex-1 flex flex-col justify-between">
                          <div>
                            <div className="text-xs text-amber-400 mb-2 font-medium">
                              {new Date(item.pubDate).toLocaleString('kmr-IQ')}
                            </div>
                            <h3 className="text-lg font-bold mb-2 text-slate-100 group-hover:text-amber-400 transition leading-snug">
                              {item.title}
                            </h3>
                          </div>
                          <div className="mt-4 text-xs font-semibold text-amber-400 flex items-center gap-1">
                            خوێندنەوەی تەواوی دەقەکە لە ڕووداو ←
                          </div>
                        </div>
                      </a>
                    ))
                  ) : (
                    <div className="col-span-2 py-12 text-center text-slate-500">
                      هیچ هەواڵێک نەدۆزرایەوە...
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
