<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APT Media - هەواڵەکان</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Noto Kufi Arabic', sans-serif;
      direction: rtl;
    }
    header {
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
      padding: 16px;
      z-index: 100;
    }
    h1 {
      text-align: center;
      color: #ff3b3b;
      font-size: 24px;
      margin-bottom: 12px;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      overflow-x: auto;
    }
    nav button {
      background: none;
      border: none;
      color: #888;
      font-size: 14px;
      padding-bottom: 4px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }
    nav button.active {
      color: #fff;
      border-bottom: 2px solid #ff3b3b;
    }
    #feed { max-width: 640px; margin: 0 auto; padding: 16px; }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 16px; }
    .card-meta { font-size: 12px; color: #666; margin-bottom: 8px; }
    .card-meta .source { color: #ff3b3b; font-weight: bold; }
    .card h2 { font-size: 18px; margin-bottom: 8px; line-height: 1.5; }
    .card p { font-size: 14px; color: #999; line-height: 1.6; }
    .card a {
      display: inline-block;
      margin-top: 12px;
      color: #ff3b3b;
      text-decoration: none;
      font-size: 14px;
    }
    #loading {
      text-align: center;
      padding: 40px;
      color: #ff3b3b;
    }
  </style>
</head>
<body>
  <header>
    <h1>APT Media</h1>
    <nav>
      <button class="active" data-cat="گشتی">گشتی</button>
      <button data-cat="ناوخۆیی">ناوخۆیی</button>
      <button data-cat="وەرزشی">وەرزشی</button>
      <button data-cat="ئابووری">ئابووری</button>
    </nav>
  </header>

  <div id="loading">لە بارکردنی هەواڵەکاندا...</div>
  <div id="feed"></div>

  <script>
    let allNews = [];
    let currentCat = 'گشتی';

    async function loadNews() {
      try {
        const res = await fetch('/api/news');
        allNews = await res.json();
        renderNews();
      } catch (err) {
        document.getElementById('loading').textContent = 'هەڵە لە بارکردن';
      }
    }

    function renderNews() {
      const feed = document.getElementById('feed');
      const loading = document.getElementById('loading');
      const filtered = currentCat === 'گشتی'
        ? allNews
        : allNews.filter(n => n.category === currentCat);

      if (filtered.length === 0) {
        loading.textContent = 'هیچ هەواڵێک نەدۆزرایەوە';
        feed.innerHTML = '';
        return;
      }

      loading.style.display = 'none';
      feed.innerHTML = filtered.map(n => `
        <article class="card">
          ${n.image ? `<img src="${n.image}" alt="" loading="lazy">` : ''}
          <div class="card-body">
            <div class="card-meta">
              <span class="source">${n.publisher}</span> • ${n.time}
            </div>
            <h2>${n.title}</h2>
            <p>${n.summary ? n.summary.substring(0, 150) + '...' : ''}</p>
            <a href="${n.url}" target="_blank">زیاتر بخوێنەوە ←</a>
          </div>
        </article>
      `).join('');
    }

    document.querySelectorAll('nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        renderNews();
      });
    });

    loadNews();
    setInterval(loadNews, 60000);
  </script>
</body>
</html>
